spring:
  application:
    name: smart-recruters
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:migration}
    username: ${DB_USERNAME:migration}
    password: ${DB_PASSWORD:migration}
  flyway:
    enabled: true
    locations: classpath:db/migration

migration:
  # IN_PROGRESS older than this is treated as abandoned (dead worker) and can be claimed again
  claim-timeout: ${MIGRATION_CLAIM_TIMEOUT:5m}
  # candidates per SAP page; the checkpoint of a job is a page number for this size
  batch-size: ${MIGRATION_BATCH_SIZE:100}
  # candidates of one job migrated at the same time (bounded virtual threads)
  parallelism: ${MIGRATION_PARALLELISM:8}
  # tenant jobs running at the same time in one instance, and how many may wait for a slot
  max-concurrent-jobs: ${MIGRATION_MAX_CONCURRENT_JOBS:2}
  job-queue-capacity: ${MIGRATION_JOB_QUEUE_CAPACITY:100}
  # RUNNING job without progress for this long is treated as abandoned; must be >= claim-timeout
  # and longer than the slowest page
  job-lease-timeout: ${MIGRATION_JOB_LEASE_TIMEOUT:10m}
  job-recovery-interval: ${MIGRATION_JOB_RECOVERY_INTERVAL:1m}

clients:
  sap:
    base-url: ${SAP_BASE_URL:http://localhost:8081}
    connect-timeout: ${SAP_CONNECT_TIMEOUT:1s}
    read-timeout: ${SAP_READ_TIMEOUT:3s}
  smartrecruiters:
    base-url: ${SMARTRECRUITERS_BASE_URL:http://localhost:8082}
    connect-timeout: ${SMARTRECRUITERS_CONNECT_TIMEOUT:1s}
    read-timeout: ${SMARTRECRUITERS_READ_TIMEOUT:3s}
  retry:
    max-attempts: ${HTTP_RETRY_MAX_ATTEMPTS:3}
    initial-backoff: ${HTTP_RETRY_INITIAL_BACKOFF:200ms}
    multiplier: ${HTTP_RETRY_MULTIPLIER:2.0}
    max-backoff: ${HTTP_RETRY_MAX_BACKOFF:2s}
  circuit-breaker:
    sliding-window-size: ${HTTP_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
    minimum-number-of-calls: ${HTTP_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:5}
    failure-rate-threshold: ${HTTP_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
    wait-duration-in-open-state: ${HTTP_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:30s}
    permitted-calls-in-half-open-state: ${HTTP_CIRCUIT_BREAKER_PERMITTED_CALLS_IN_HALF_OPEN_STATE:2}
